name: Manual Trigger Workflow

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Message to print in the run logs'
        required: true
        default: 'Hello from TurboGit Cloud!'

jobs:
  run-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Message
        run: |
          echo "TurboGit Trigger: ${{ github.event.inputs.message }}"
          echo "Run on branch: ${{ github.ref }}"
          echo "Triggered by: ${{ github.actor }}"
